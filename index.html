/* PROFILE CARD */

.profile-card{
    background:white;
    width:350px;

    border-radius:20px;

.main{
    margin-left:240px;
    width:100%;
    height:100vh;

    flex-direction:column;
    justify-content:center;
    align-items:center;
}
.profile-card img{
    width:120px;
    display:block;
    margin:auto;
    margin-bottom:20px;
}

.info{
    margin:15px 0;
}

.label{
    color:gray;
    font-size:14px;

.value{
    font-weight:bold;
    margin-top:5px;

button{

    border:none;
    border-radius:10px;
    background:#27374d;
    color:white;
    cursor:pointer;
