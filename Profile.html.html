<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q4 Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef2f7;
}

/* SIDEBAR */

.sidebar{
    width:240px;
    height:100vh;
    background:linear-gradient(to bottom, #27374d, #1b263b);
    color:white;
    padding:20px;
    position:fixed;
    top:0;
    left:0;
}

.logo{
    text-align:center;
    margin-bottom:40px;
}

.logo h2{
    font-size:32px;
    margin-top:10px;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    transition:0.3s;
}

.menu a:hover{
    background:#526d82;
    transform:translateX(5px);
}

/* MAIN */

.main{
    margin-left:240px;
    min-height:100vh;
    padding:30px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* NAVBAR */

.custom-navbar{
    width:100%;
    background:white;
    border-radius:15px;
    padding:10px 20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    margin-bottom:40px;
}

/* TITLE */

.title{
    background:#27374d;
    color:white;
    padding:12px 30px;
    border-radius:12px;
    margin-bottom:30px;
}

/* PROFILE CARD */

.profile-card{
    background:white;
    width:360px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.profile-card img{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
    display:block;
    margin:auto;
    margin-bottom:20px;
}

.info{
    margin:18px 0;
}

.label{
    color:gray;
    font-size:14px;
}

.value{
    font-size:22px;
    font-weight:bold;
    margin-top:5px;
}

.profile-btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#27374d;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.profile-btn:hover{
    background:#526d82;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        <h2>STUDENT</h2>
    </div>

    <div class="menu">
        <a href="#">Dashboard</a>
        <a href="#">Subjects</a>
        <a href="#">Activities</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
    </div>

</div>

<!-- MAIN CONTENT -->

<div class="main">

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand" href="#">
                <img src="eagle.png" alt="Logo" style="height:60px;">
            </a>

            <!-- TOGGLER -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- NAV LINKS -->
            <div class="collapse navbar-collapse" id="mynavbar">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link text-dark" href="dashboard.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark" href="notebook.html">Notebooks</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark" href="task.html">Tasks</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark" href="profile.html">Profile</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark" href="index.html">Logout</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- TITLE -->

    <div class="title">
        <h1>My Profile</h1>
    </div>

    <!-- PROFILE CARD -->

    <div class="profile-card">

        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/LeBron_James_%2851959977144%29_%28cropped2%29.jpg" alt="Profile">

        <div class="info">
            <div class="label">Student Name</div>
            <div class="value">Lebron James</div>
        </div>

        <div class="info">
            <div class="label">Grade & Section</div>
            <div class="value">Grade 9 - Leo</div>
        </div>

        <div class="info">
            <div class="label">Email</div>
            <div class="value">LebronJames@email.com</div>
        </div>

        <button class="profile-btn">Edit Profile</button>

    </div>
<footer>
    <p>By Sean Chua, Andre Pagud, Jowinson Sy, Dylan Alip</p>
</footer>
</div>
        
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
